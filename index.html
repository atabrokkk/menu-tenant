<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menu - Foodcourt Central</title>
    <!-- CSS Utama -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Google (Inter) agar tampilan modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CONTAINER UTAMA (Membatasi lebar maksimal agar bagus di HP) -->
    <div class="app-container">

        <!-- HEADER APLIKASI -->
        <header class="app-header">
            <div class="brand">
                <h1 id="place-name">KULINER HUB</h1>
                <p id="place-desc">Pusat Jajanan & Tempat Nongkrong</p>
            </div>
            
        </header>

        <!-- MAIN CONTENT AREA -->
        <main>
            <!-- 1. HALAMAN DAFTAR TENANT (DEFAULT TAMPIL) -->
            <section id="view-tenants" class="view active">
                <div class="section-title">
                    <h2>Pilih Tenant / Lapak</h2>
                    <p>Silakan pilih tenant untuk melihat daftar menu</p>
                </div>
                <!-- Tempat kartu tenant di-render oleh JS -->
                <div id="tenant-list" class="tenant-grid"></div>
            </section>

            <!-- 2. HALAMAN MENU TENANT (SEMBUNYI BY DEFAULT) -->
            <section id="view-menu" class="view">
                <!-- Tombol Kembali -->
                <button id="btn-back" class="btn-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Kembali ke Daftar Tenant
                </button>

                <!-- Header Informasi Tenant yang Dipilih -->
                <div id="tenant-detail-header" class="tenant-header-card">
                    <!-- Ditampilkan dinamis dari JS -->
                </div>

                <!-- Fitur Pencarian & Filter Kategori -->
                <div class="filter-container">
                    <input type="text" id="search-input" placeholder="Cari makanan atau minuman...">
                    <div id="category-pills" class="category-pills">
                        <!-- Pill kategori dimasukkan via JS -->
                    </div>
                </div>

                <!-- Daftar Produk Menu -->
                <div id="product-list" class="product-grid">
                    <!-- Ditampilkan dinamis dari JS -->
                </div>
            </section>
        </main>

        <!-- FOOTER Sederhana -->
        <footer class="app-footer">
            <p>&copy; 2026 Kuliner Hub. All rights reserved.</p>
        </footer>

    </div>

    <!-- JavaScript Utama -->
    <script src="script.js"></script>
</body>
</html>
